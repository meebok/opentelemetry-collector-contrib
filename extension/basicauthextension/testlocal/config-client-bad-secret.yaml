extensions:
  awssecretsmanagerprovider/client:
    secret_arn: "arn:aws:secretsmanager:us-east-1:000000000000:secret:does-not-exist"
    region: us-east-1
    refresh_interval: 10s

  basicauth/client:
    client_auth:
      secret_provider:
        id: awssecretsmanagerprovider/client
        username_key: user
        password_key: pass

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319

exporters:
  otlphttp:
    endpoint: http://localhost:4318
    auth:
      authenticator: basicauth/client

service:
  telemetry:
    logs:
      level: info
  extensions: [awssecretsmanagerprovider/client, basicauth/client]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp]
